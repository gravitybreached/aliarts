version: '3.8'

services:
  aliarts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aliarts-app
    restart: unless-stopped
    ports:
      # Host port 3001 → Container port 3000
      # Port 3001 on your OCI server to avoid conflict with existing apps on 3000
      - "3001:3000"
    environment:
      # ─── CockroachDB ───
      - DATABASE_URL=postgresql://aliarts:clUKLBXTxpzW1hb09Kzd3Q@bright-burro-15816.jxf.gcp-asia-southeast1.cockroachlabs.cloud:26257/defaultdb?sslmode=require
      - USER_ROACH=aliarts
      - PASSWORD_ROACH=clUKLBXTxpzW1hb09Kzd3Q
      - HOST_ROACH=bright-burro-15816.jxf.gcp-asia-southeast1.cockroachlabs.cloud

      # ─── Scaleway Object Storage ───
      - SCALEWAY_ACCESS_KEY=SCW724X1XEW4EBEQPBDX
      - SCALEWAY_SECRET_KEY=45fce482-6cd5-446b-87d2-1118068745af
      - SCALEWAY_BUCKET=img-vessel
      - SCALEWAY_REGION=fr-par
      - SCALEWAY_ENDPOINT=https://s3.fr-par.scw.cloud
      - SCALEWAY_BASE_PATH=aliarts
      - SCALEWAY_ADMIN_PATH=aliarts/admin
      - SCALEWAY_USER_PATH=aliarts/users

      # ─── NextAuth ───
      # IMPORTANT: Change NEXTAUTH_URL to your actual domain before going live!
      - NEXTAUTH_URL=https://yourdomain.com
      # IMPORTANT: Generate a strong secret: openssl rand -base64 32
      - NEXTAUTH_SECRET=aliarts-super-secret-key-change-in-production-2024

      # ─── App ───
      - NEXT_PUBLIC_APP_URL=https://yourdomain.com
      - NEXT_PUBLIC_APP_NAME=AliArts
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
