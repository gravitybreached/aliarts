# ─── AliArts Nginx Configuration ───
#
# HOW TO USE:
# 1. Copy this file to your OCI server: /etc/nginx/sites-available/aliarts
# 2. Create symlink: sudo ln -s /etc/nginx/sites-available/aliarts /etc/nginx/sites-enabled/
# 3. Replace "yourdomain.com" with your actual domain (e.g., aliarts.yourname.com)
# 4. Test config: sudo nginx -t
# 5. Reload Nginx: sudo systemctl reload nginx
# 6. Get SSL cert: sudo certbot --nginx -d yourdomain.com
#
# This config coexists peacefully with your other Nginx server blocks.
# Each site gets its own server block — no conflicts.

# ── HTTP → HTTPS Redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt challenge (needed for certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server Block ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ─── SSL Certificates ───
    # After running certbot, these will be auto-filled.
    # Placeholder paths — certbot will replace them:
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Reverse Proxy to AliArts Docker Container ───
    location / {
        proxy_pass http://127.0.0.1:3001;

        # Standard reverse proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Next.js hot reload in dev, useful for future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ─── Next.js Static Assets Caching ───
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        # Next.js static assets have content hashes in filenames — cache aggressively
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Public folder assets caching ───
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── Max upload size (for Scaleway uploads through the app) ───
    client_max_body_size 50M;
}
